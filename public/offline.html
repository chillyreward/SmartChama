<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" 
    content="width=device-width, 
    initial-scale=1.0" />
  <title>Offline — SmartChama</title>
  <style>
    * { margin: 0; padding: 0; 
        box-sizing: border-box; }
    body {
      font-family: -apple-system, 
        BlinkMacSystemFont, 
        'Segoe UI', sans-serif;
      background: #000000;
      color: #F0FDF4;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .icon {
      width: 80px;
      height: 80px;
      background: #052e16;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 36px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #F0FDF4;
    }
    p {
      font-size: 16px;
      color: #86EFAC;
      max-width: 300px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    button {
      background: #22C55E;
      color: white;
      border: none;
      padding: 16px 32px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .logo {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
      font-weight: 700;
      color: #22C55E;
    }
  </style>
</head>
<body>
  <div class="logo">SmartChama</div>
  
  <div class="icon">📡</div>
  
  <h1>You are offline</h1>
  
  <p>
    Check your internet connection 
    and try again. Your data is safe 
    and will sync when you reconnect.
  </p>
  
  <button onclick="window.location.reload()">
    Try Again
  </button>
</body>
</html>
